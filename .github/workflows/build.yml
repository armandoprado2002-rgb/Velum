              val cur = remember(songs, curId) { songs.firstOrNull { it.id.toString() == curId } }
              val isFav = cur != null && cur.id.toString() in favs

              fun toggleFav(id: Long) {
                  val k = id.toString()
                  favs = if (k in favs) favs - k else favs + k
                  prefs.edit().putStringSet("favs", HashSet(favs)).apply()
              }
              fun play(list: List<Song>, i: Int) {
                  if (list.isEmpty()) return
                  val start = (i - 200).coerceAtLeast(0)
                  val sub = list.subList(start, minOf(list.size, start + 1000))
                  ctl.setMediaItems(sub.map { it.toItem() }, i - start, 0L)
                  ctl.prepare()
                  ctl.play()
