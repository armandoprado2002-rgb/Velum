          package com.velum.player

          import android.content.ContentUris
          import android.content.Context
          import android.graphics.Bitmap
          import android.net.Uri
          import android.provider.MediaStore
          import android.util.LruCache
          import android.util.Size
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext

          data class Song(val id: Long, val title: String, val artist: String, val album: String, val albumId: Long) {
              val uri: Uri get() = ContentUris.withAppendedId(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, id)
          }

          object Art {
              private val cache = LruCache<Long, Bitmap>(80)
              suspend fun get(ctx: Context, s: Song): Bitmap? = withContext(Dispatchers.IO) {
                  val hit = cache.get(s.id)
                  if (hit != null) {
                      hit
                  } else {
                      val b = runCatching { ctx.contentResolver.loadThumbnail(s.uri, Size(400, 400), null) }.getOrNull()
                      if (b != null) cache.put(s.id, b)
                      b
                  }
              }
          }

          // Detecta sola toda la música del teléfono (MediaStore), sin elegir carpeta
          fun loadSongs(ctx: Context): List<Song> {
              val out = mutableListOf<Song>()
              val proj = arrayOf(
                  MediaStore.Audio.Media._ID,
                  MediaStore.Audio.Media.TITLE,
                  MediaStore.Audio.Media.ARTIST,
                  MediaStore.Audio.Media.ALBUM,
                  MediaStore.Audio.Media.ALBUM_ID
              )
              val sel = MediaStore.Audio.Media.IS_MUSIC + " != 0 AND " + MediaStore.Audio.Media.DURATION + " > 30000"
              ctx.contentResolver.query(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, proj, sel, null, null)?.use { c ->
                  while (c.moveToNext()) {
                      val artist = c.getString(2)
                      out.add(
                          Song(
                              c.getLong(0),
                              c.getString(1) ?: "Sin título",
                              if (artist == null || artist == "<unknown>") "Artista desconocido" else artist,
                              c.getString(3) ?: "Álbum",
                              c.getLong(4)
                          )
                      )
                  }
              }
              return out.sortedBy { it.title.lowercase() }
          }
