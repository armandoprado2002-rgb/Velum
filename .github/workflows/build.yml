          // Barra de progreso ondulada estilo Pixel: fluida, se aplana al pausar
          @Composable
          fun WavySeek(pos: FloatState, dur: FloatState, playing: Boolean, color: Color, onSeek: (Float) -> Unit) {
              var scrub by remember { mutableStateOf<Float?>(null) }
              val seek by rememberUpdatedState(onSeek)
              val amp by animateFloatAsState(if (playing) 1f else 0f, tween(400), label = "amp")
              val phase by rememberInfiniteTransition(label = "wave").animateFloat(
                  initialValue = 0f,
                  targetValue = (2.0 * PI).toFloat(),
                  animationSpec = infiniteRepeatable(tween(1800, easing = LinearEasing)),
                  label = "phase"
              )
              Canvas(
                  Modifier.fillMaxWidth().height(40.dp)
                      .pointerInput(Unit) {
                          detectTapGestures { o -> seek((o.x / size.width).coerceIn(0f, 1f)) }
                      }
                      .pointerInput(Unit) {
                          detectHorizontalDragGestures(
                              onDragStart = { o -> scrub = (o.x / size.width).coerceIn(0f, 1f) },
                              onDragEnd = {
                                  val s = scrub
                                  if (s != null) seek(s)
                                  scrub = null
                              },
                              onDragCancel = { scrub = null },
                              onHorizontalDrag = { change, _ -> scrub = (change.position.x / size.width).coerceIn(0f, 1f) }
                          )
                      }
              ) {
                  val w = size.width
                  val cy = size.height / 2f
                  val d = dur.floatValue.coerceAtLeast(1f)
                  val frac = (scrub ?: (pos.floatValue / d)).coerceIn(0f, 1f)
                  val x = w * frac
                  val stroke = 4.dp.toPx()
                  val a = 5.dp.toPx() * amp
                  val k = (2.0 * PI).toFloat() / 28.dp.toPx()
                  drawLine(color.copy(alpha = 0.25f), Offset(x, cy), Offset(w, cy), stroke, StrokeCap.Round)
                  val path = Path()
                  path.moveTo(0f, cy + a * sin(-phase))
                  var xx = 3f
                  while (xx < x) {
                      path.lineTo(xx, cy + a * sin(k * xx - phase))
                      xx += 3f
                  }
                  path.lineTo(x, cy + a * sin(k * x - phase))
                  drawPath(path, color, style = Stroke(width = stroke, cap = StrokeCap.Round, join = StrokeJoin.Round))
                  drawLine(color, Offset(x, cy - 13.dp.toPx()), Offset(x, cy + 13.dp.toPx()), stroke, StrokeCap.Round)
              }
          }

          @Composable
          fun TimeRow(pos: FloatState, dur: FloatState) {
              val e by remember { derivedStateOf { (pos.floatValue / 1000f).toInt() } }
              val t by remember { derivedStateOf { (dur.floatValue / 1000f).toInt() } }
              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                  Text(fmt(e), color = Color.White.copy(alpha = 0.7f), fontSize = 12.sp)
                  Text(fmt(t), color = Color.White.copy(alpha = 0.7f), fontSize = 12.sp)
              }
          }

          @Composable
          fun rememberController(): MediaController? {
              val ctx = LocalContext.current
              var c by remember { mutableStateOf<MediaController?>(null) }
              DisposableEffect(Unit) {
                  val token = SessionToken(ctx, ComponentName(ctx, PlaybackService::class.java))
                  val f = MediaController.Builder(ctx, token).buildAsync()
                  f.addListener({
                      if (!f.isCancelled) c = runCatching { f.get() }.getOrNull()
                  }, ctx.mainExecutor)
                  onDispose { MediaController.releaseFuture(f) }
              }
              return c
          }

