name: Construir Velum Music

on:
  push:
    branches: ['**']
    paths: ['www/**', 'android/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Preparar Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Construir APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Velum-Music.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Velum-Music-apk
          path: Velum-Music.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Velum Music v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Velum-Music.apk
          body: |
            Descarga **Velum-Music.apk** desde tu teléfono Android y ábrelo para instalar.
            Si Android pregunta, permite "instalar apps de origen desconocido" para tu navegador.

            Al abrir Velum toca **Elegir carpeta de música**, entra a la carpeta donde guardas tus canciones y toca **Usar esta carpeta**.
