          // Reflejo translúcido que aparece donde tocas y se desvanece
          fun Modifier.glass(): Modifier = composed {
              var pos by remember { mutableStateOf<Offset?>(null) }
              val a = remember { Animatable(0f) }
              val scope = rememberCoroutineScope()
              this.pointerInput(Unit) {
                  awaitEachGesture {
                      val d = awaitFirstDown(requireUnconsumed = false, pass = PointerEventPass.Initial)
                      pos = d.position
                      scope.launch { a.snapTo(1f) }
                      do {
                          val e = awaitPointerEvent(PointerEventPass.Initial)
                          val first = e.changes.firstOrNull()
                          if (first != null) pos = first.position
                      } while (e.changes.any { it.pressed })
                      scope.launch { a.animateTo(0f, tween(550)) }
                  }
              }.drawWithContent {
                  drawContent()
                  val p = pos
                  if (p != null && a.value > 0f) {
                      drawRect(
                          Brush.radialGradient(
                              colors = listOf(
                                  Color.White.copy(alpha = 0.30f * a.value),
                                  Color.White.copy(alpha = 0.08f * a.value),
                                  Color.Transparent
                              ),
                              center = p,
                              radius = size.maxDimension * 0.6f
                          )
                      )
                  }
              }
          }

