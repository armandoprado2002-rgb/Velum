                          .clip(RoundedCornerShape(28.dp, 28.dp, 0.dp, 0.dp))
                          .background(Color(0xFF14141C))
                          .pointerInput(Unit) { detectTapGestures { } }
                          .verticalScroll(rememberScrollState())
                          .navigationBarsPadding()
                          .padding(20.dp)
                  ) {
                      Text("Ajustes de audio", color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.Bold)
                      Label("Velocidad")
                      Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          listOf(0.75f to "0.75×", 1f to "Normal", 1.25f to "1.25×", 1.5f to "1.5×", 2f to "2×").forEach { (v, name) ->
                              Chip(name, speed == v, tint) {
                                  speed = v
                                  ctl.setPlaybackSpeed(v)
                              }
                          }
                      }
                      Label("Temporizador de apagado")
                      Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          listOf(0 to "Apagado", 15 to "15 min", 30 to "30 min", 45 to "45 min", 60 to "60 min").forEach { (m, name) ->
                              Chip(name, m == 0 && left == 0, tint) { svc?.setSleep(m) }
                          }
                      }
                      if (left > 0) {
                          Text("La música se detendrá en " + left.toString() + " min", color = Color.White.copy(alpha = 0.7f), fontSize = 12.sp, modifier = Modifier.padding(top = 8.dp))
                      }
                      if (bands > 0) {
                          Label("Ecualizador")
                          if (presets.isNotEmpty()) {
                              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  presets.forEachIndexed { i, name ->
                                      Chip(name, false, tint) {
                                          svc?.usePreset(i)
                                          for (b in 0 until bands) levels[b] = svc?.eqLevel(b) ?: 0
                                      }
                                  }
                              }
                          }
                          for (b in 0 until bands) {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Text(freqLabel(svc?.eqFreq(b) ?: 0), color = Color.White.copy(alpha = 0.7f), fontSize = 12.sp, modifier = Modifier.width(64.dp))
                                  Slider(
                                      value = levels[b].toFloat(),
                                      onValueChange = { v ->
