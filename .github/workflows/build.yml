          import androidx.media3.session.MediaSessionService
          import com.google.common.util.concurrent.ListenableFuture
          import com.google.common.util.concurrent.MoreExecutors
          import java.util.concurrent.Executors

          // Carga la carátula desde el archivo de audio para la notificación y la pantalla bloqueada
          @OptIn(UnstableApi::class)
          class ThumbLoader(private val ctx: Context) : BitmapLoader {
              private val exec = MoreExecutors.listeningDecorator(Executors.newSingleThreadExecutor())
              override fun supportsMimeType(mimeType: String): Boolean = true
              override fun decodeBitmap(data: ByteArray): ListenableFuture<Bitmap> =
                  exec.submit<Bitmap> { BitmapFactory.decodeByteArray(data, 0, data.size) }
              override fun loadBitmap(uri: Uri): ListenableFuture<Bitmap> =
                  exec.submit<Bitmap> { ctx.contentResolver.loadThumbnail(uri, Size(512, 512), null) }
          }

          @OptIn(UnstableApi::class)
          class PlaybackService : MediaSessionService() {
              private var session: MediaSession? = null
              private var eq: Equalizer? = null
              private var bass: BassBoost? = null
              private val handler = Handler(Looper.getMainLooper())
              private val stopper = Runnable {
                  session?.player?.pause()
                  sleepEnd = 0L
              }

              companion object {
                  @Volatile
                  var instance: PlaybackService? = null
                  var sleepEnd by mutableLongStateOf(0L)
              }

              override fun onCreate() {
                  super.onCreate()
                  instance = this
                  val sp = getSharedPreferences("velum", Context.MODE_PRIVATE)
                  val sid = (getSystemService(Context.AUDIO_SERVICE) as AudioManager).generateAudioSessionId()
                  val player = ExoPlayer.Builder(this)
                      .setAudioAttributes(
                          AudioAttributes.Builder().setContentType(C.AUDIO_CONTENT_TYPE_MUSIC).setUsage(C.USAGE_MEDIA).build(),
                          true
                      )
                      .setHandleAudioBecomingNoisy(true)
                      .setWakeMode(C.WAKE_MODE_LOCAL)
                      .build()
                  player.setAudioSessionId(sid)
                  val open = PendingIntent.getActivity(
                      this, 0,
                      Intent(this, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  session = MediaSession.Builder(this, player)
                      .setBitmapLoader(ThumbLoader(this))
                      .setSessionActivity(open)
                      .build()
                  runCatching {
                      val e = Equalizer(0, sid)
                      e.setEnabled(true)
                      eq = e
                      val saved = sp.getString("eq", null)?.split(",")?.mapNotNull { it.toIntOrNull() }
                      if (saved != null) {
                          val lo = e.bandLevelRange[0].toInt()
                          val hi = e.bandLevelRange[1].toInt()
                          for (i in saved.indices) {
                              if (i < e.numberOfBands.toInt()) e.setBandLevel(i.toShort(), saved[i].coerceIn(lo, hi).toShort())
                          }
                      }
                  }
                  runCatching {
                      val bb = BassBoost(0, sid)
                      bb.setEnabled(true)
                      bass = bb
                      if (bb.strengthSupported) bb.setStrength(sp.getInt("bass", 0).toShort())
                  }
              }

              override fun onGetSession(controllerInfo: MediaSession.ControllerInfo): MediaSession? = session

              override fun onTaskRemoved(rootIntent: Intent?) {
                  val p = session?.player
                  if (p == null || !p.playWhenReady || p.mediaItemCount == 0) stopSelf()
              }

              override fun onDestroy() {
                  instance = null
                  handler.removeCallbacks(stopper)
                  sleepEnd = 0L
                  eq?.release()
                  bass?.release()
                  session?.run {
                      player.release()
                      release()
                  }
                  session = null
                  super.onDestroy()
              }

              // ---- Temporizador de apagado ----
              fun setSleep(min: Int) {
                  handler.removeCallbacks(stopper)
                  if (min <= 0) {
                      sleepEnd = 0L
                  } else {
                      sleepEnd = System.currentTimeMillis() + min * 60000L
                      handler.postDelayed(stopper, min * 60000L)
                  }
              }

              // ---- Ecualizador y graves ----
              fun eqBands(): Int = eq?.numberOfBands?.toInt() ?: 0
              fun eqRange(): Pair<Int, Int> {
                  val r = eq?.bandLevelRange
                  return if (r != null) Pair(r[0].toInt(), r[1].toInt()) else Pair(-1500, 1500)
              }
              fun eqFreq(b: Int): Int = (eq?.getCenterFreq(b.toShort()) ?: 0) / 1000
              fun eqLevel(b: Int): Int = eq?.getBandLevel(b.toShort())?.toInt() ?: 0
              fun setEqLevel(b: Int, level: Int) {
                  runCatching { eq?.setBandLevel(b.toShort(), level.toShort()) }
                  saveEq()
              }
              fun presetNames(): List<String> {
                  val e = eq ?: return emptyList()
                  return (0 until e.numberOfPresets.toInt()).map { e.getPresetName(it.toShort()) }
              }
              fun usePreset(i: Int) {
                  runCatching { eq?.usePreset(i.toShort()) }
                  saveEq()
              }
              fun bassLevel(): Int = bass?.roundedStrength?.toInt() ?: 0
              fun setBass(v: Int) {
                  runCatching { bass?.setStrength(v.coerceIn(0, 1000).toShort()) }
                  getSharedPreferences("velum", Context.MODE_PRIVATE).edit().putInt("bass", v.coerceIn(0, 1000)).apply()
              }
              private fun saveEq() {
                  val e = eq ?: return
                  val s = (0 until e.numberOfBands.toInt()).joinToString(",") { e.getBandLevel(it.toShort()).toString() }
                  getSharedPreferences("velum", Context.MODE_PRIVATE).edit().putString("eq", s).apply()
              }
          }
          EOF

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Velum-apk
          path: app/build/outputs/apk/debug/app-debug.apk
