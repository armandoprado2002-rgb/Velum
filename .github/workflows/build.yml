              val audioPerm = if (Build.VERSION.SDK_INT >= 33) Manifest.permission.READ_MEDIA_AUDIO else Manifest.permission.READ_EXTERNAL_STORAGE
              val launcher = rememberLauncherForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) { res ->
                  granted = res[audioPerm] == true
              }
              LaunchedEffect(Unit) {
                  val perms = if (Build.VERSION.SDK_INT >= 33) arrayOf(audioPerm, Manifest.permission.POST_NOTIFICATIONS) else arrayOf(audioPerm)
                  launcher.launch(perms)
              }
              LaunchedEffect(granted) {
                  if (granted) {
                      songs = withContext(Dispatchers.IO) { loadSongs(ctx) }
                      loaded = true
                  }
              }

              var curId by remember { mutableStateOf(ctl.currentMediaItem?.mediaId) }
              var playing by remember { mutableStateOf(ctl.isPlaying) }
              var shuffle by remember { mutableStateOf(ctl.shuffleModeEnabled) }
              var repeatMode by remember { mutableIntStateOf(ctl.repeatMode) }
              var favs by remember { mutableStateOf(prefs.getStringSet("favs", emptySet<String>())?.toSet() ?: emptySet<String>()) }
              DisposableEffect(ctl) {
                  val l = object : Player.Listener {
                      override fun onIsPlayingChanged(isPlaying: Boolean) { playing = isPlaying }
                      override fun onMediaItemTransition(mediaItem: MediaItem?, reason: Int) { curId = mediaItem?.mediaId }
                      override fun onShuffleModeEnabledChanged(shuffleModeEnabled: Boolean) { shuffle = shuffleModeEnabled }
                      override fun onRepeatModeChanged(mode: Int) { repeatMode = mode }
                  }
                  ctl.addListener(l)
